<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brochure de Servicios 2026</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            background: #1f2430;
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .escenario {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 0;
        }

        #libro {
            margin: 0 auto;
        }

        .pagina {
            background: #fff;
            overflow: hidden;
        }

        .pagina canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Capa de enlaces, posicionada en % sobre cada página */
        .capa-enlaces {
            position: absolute;
            inset: 0;
        }

        .capa-enlaces a {
            position: absolute;
            display: block;
            cursor: pointer;
            border-radius: 2px;
            transition: background .15s;
        }

        .capa-enlaces a:hover {
            background: rgba(255, 213, 0, .25);
            outline: 1px solid rgba(255, 213, 0, .8);
        }

        .barra {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 16px;
            background: #151922;
        }

        .barra button, .barra a {
            background: #2d3444;
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
        }

        .barra button:hover, .barra a:hover { background: #3c455a; }
        .barra button:disabled { opacity: .4; cursor: default; }

        #contador { min-width: 90px; text-align: center; }

        #cargando {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1f2430;
            font-size: 1.1rem;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="cargando">Cargando brochure…</div>

    <main class="escenario">
        <div id="libro"></div>
    </main>

    <nav class="barra">
        <button id="btnAnterior" aria-label="Página anterior"><i class="bi bi-chevron-left"></i></button>
        <span id="contador">– / –</span>
        <button id="btnSiguiente" aria-label="Página siguiente"><i class="bi bi-chevron-right"></i></button>
        <a href="./Brochure_de_Servicios_2026.pdf" download aria-label="Descargar PDF"><i class="bi bi-download"></i></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script type="module">
        import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";

        const URL_PDF = "./Brochure_de_Servicios_2026.pdf";
        const ANCHO_RENDER = 1100; // px de ancho con que se rasteriza cada página

        const libro = document.getElementById("libro");
        const contador = document.getElementById("contador");
        const btnAnterior = document.getElementById("btnAnterior");
        const btnSiguiente = document.getElementById("btnSiguiente");

        let flip;

        // Devuelve el índice (0-based) de la página destino de un enlace interno
        async function indiceDestino(pdf, dest) {
            const explicito = typeof dest === "string" ? await pdf.getDestination(dest) : dest;
            if (!explicito) return null;
            const ref = explicito[0];
            return typeof ref === "object" ? await pdf.getPageIndex(ref) : ref;
        }

        async function crearPagina(pdf, numero) {
            const page = await pdf.getPage(numero);
            const base = page.getViewport({ scale: 1 });
            const viewport = page.getViewport({ scale: ANCHO_RENDER / base.width });

            const div = document.createElement("div");
            div.className = "pagina";

            const canvas = document.createElement("canvas");
            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);
            await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
            div.appendChild(canvas);

            // Recrear los enlaces del PDF como <a> sobre la imagen
            const capa = document.createElement("div");
            capa.className = "capa-enlaces";
            const anotaciones = await page.getAnnotations();

            for (const anot of anotaciones) {
                if (anot.subtype !== "Link") continue;

                const [x1, y1, x2, y2] = viewport.convertToViewportRectangle(anot.rect);
                const a = document.createElement("a");
                a.style.left = (Math.min(x1, x2) / viewport.width * 100) + "%";
                a.style.top = (Math.min(y1, y2) / viewport.height * 100) + "%";
                a.style.width = (Math.abs(x2 - x1) / viewport.width * 100) + "%";
                a.style.height = (Math.abs(y2 - y1) / viewport.height * 100) + "%";

                if (anot.url || anot.unsafeUrl) {
                    a.href = anot.url || anot.unsafeUrl;
                    a.target = "_blank";
                    a.rel = "noopener";
                    a.title = a.href;
                } else if (anot.dest) {
                    const destino = await indiceDestino(pdf, anot.dest);
                    if (destino === null) continue;
                    a.href = "#pagina-" + (destino + 1);
                    a.title = "Ir a la página " + (destino + 1);
                    a.addEventListener("click", (e) => {
                        e.preventDefault();
                        flip.flip(destino);
                    });
                } else {
                    continue;
                }
                capa.appendChild(a);
            }

            div.appendChild(capa);
            return { div, ancho: viewport.width, alto: viewport.height };
        }

        function actualizarBarra() {
            const actual = flip.getCurrentPageIndex() + 1;
            const total = flip.getPageCount();
            contador.textContent = actual + " / " + total;
            btnAnterior.disabled = actual <= 1;
            btnSiguiente.disabled = actual >= total;
        }

        async function iniciar() {
            const pdf = await pdfjsLib.getDocument(URL_PDF).promise;

            const paginas = [];
            for (let i = 1; i <= pdf.numPages; i++) {
                paginas.push(await crearPagina(pdf, i));
            }
            paginas.forEach(p => libro.appendChild(p.div));

            const { ancho, alto } = paginas[0];
            flip = new St.PageFlip(libro, {
                width: ancho / 2,
                height: alto / 2,
                size: "stretch",
                minWidth: 200,
                maxWidth: ancho,
                minHeight: 200,
                maxHeight: alto,
                maxShadowOpacity: 0.5,
                showCover: true,
                usePortrait: true,
                mobileScrollSupport: false,
                clickEventForward: true
            });
            flip.loadFromHTML(paginas.map(p => p.div));

            flip.on("flip", actualizarBarra);
            flip.on("changeOrientation", actualizarBarra);

            // Abrir en la página indicada en el hash (#pagina-3)
            const inicial = parseInt((location.hash.match(/pagina-(\d+)/) || [])[1], 10);
            if (inicial) flip.turnToPage(Math.min(inicial, pdf.numPages) - 1);

            actualizarBarra();
            document.getElementById("cargando").remove();
        }

        btnAnterior.addEventListener("click", () => flip.flipPrev());
        btnSiguiente.addEventListener("click", () => flip.flipNext());
        document.addEventListener("keydown", (e) => {
            if (!flip) return;
            if (e.key === "ArrowLeft") flip.flipPrev();
            if (e.key === "ArrowRight") flip.flipNext();
        });

        iniciar().catch((err) => {
            console.error(err);
            document.getElementById("cargando").textContent = "No se pudo cargar el brochure.";
        });
    </script>
</body>

</html>
